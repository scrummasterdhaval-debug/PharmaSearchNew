<!DOCTYPE html>
<html>
<head>
    <title>PharmaSearch</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        @keyframes slide-down {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1419 100%);
            color: #e5e7eb;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(96, 165, 250, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* A slim bar: the name on the left, the account on the right, the
           admin's shortcuts between, so the search starts near the top. */
        .topbar {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(96, 165, 250, 0.15);
            backdrop-filter: blur(10px);
            animation: slide-down 0.6s ease-out;
        }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand-logo { width: 40px; height: 40px; flex: 0 0 auto; filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.35)); }
        .brand-name {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.1;
            background: linear-gradient(135deg, #60a5fa, #34d399, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-tag { font-size: 13px; color: rgba(255, 255, 255, 0.6); }
        .admin-links { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
        .admin-links a {
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #93c5fd;
            text-decoration: none;
            background: rgba(96, 165, 250, 0.12);
            border: 1px solid rgba(96, 165, 250, 0.25);
            transition: background 0.2s, transform 0.2s;
        }
        .admin-links a:hover { background: rgba(96, 165, 250, 0.22); transform: translateY(-1px); }
        .account { display: flex; align-items: center; gap: 10px; margin: 0 0 0 auto; min-width: 0; }
        .admin-links + .account { margin-left: 8px; }
        .account .who {
            color: #e5e7eb;
            font-weight: 600;
            font-size: 14px;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .account .signout {
            background: rgba(96, 165, 250, 0.2);
            border: 1px solid rgba(96, 165, 250, 0.3);
            color: #60a5fa;
        }
        .account .signout:hover { background: rgba(96, 165, 250, 0.3); color: #93c5fd; }
        @media (max-width: 900px) {
            .topbar { flex-wrap: wrap; padding: 12px 16px; gap: 10px; }
            .admin-links { order: 3; width: 100%; margin-left: 0; }
            .account { margin-left: auto; }
            .brand-tag { display: none; }
            .account .who { max-width: 150px; }
        }

        .search-card {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.12) 0%, rgba(34, 197, 94, 0.08) 100%);
            border: 2px solid rgba(96, 165, 250, 0.25);
            border-radius: 16px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slide-down 0.8s ease-out;
            animation-delay: 0.2s;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(96, 165, 250, 0.2);
            color: #e5e7eb;
            transition: all 0.3s ease;
        }

        /* The open list of a select is drawn by the browser, white unless
           told otherwise, and the options inherited the light text colour:
           country names were white on white. */
        .form-select {
            color-scheme: dark;
        }

        .form-select option {
            background-color: #1a1f3a;
            color: #e5e7eb;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
            color: #e5e7eb;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(74, 144, 226, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(74, 144, 226, 0.4);
        }

        .form-label {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
        }

        .form-check-label {
            color: rgba(255, 255, 255, 0.7);
        }

        /* A phone: less padding round the form, so the boxes get the width. */
        @media (max-width: 576px) {
            .search-card { padding: 22px 18px; border-radius: 12px; }
            .search-card h2 { font-size: 22px !important; margin-bottom: 16px !important; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true">
            <defs><linearGradient id="brandPill" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#34d399"/></linearGradient></defs>
            <rect x="8" y="22" width="48" height="20" rx="10" transform="rotate(-35 32 32)" fill="url(#brandPill)"/>
        </svg>
        <div>
            <div class="brand-name">PharmaSearch</div>
            <div class="brand-tag">Global pharmaceutical regulatory search</div>
        </div>
    </div>
    {% if user_is_admin %}
    <nav class="admin-links" aria-label="Admin">
        <a href="/admin">📊 Admin dashboard</a>
        <a href="/admin/operations">🔄 Harvest data</a>
        <a href="/catalogue">📚 Catalogue</a>
        <a href="/connector_health_page">📡 Connectors</a>
    </nav>
    {% endif %}
    {% if user %}
    <form method="post" action="/admin/logout" class="account">
        <span class="who" title="{{ user }}">{{ user }}</span>
        <button class="btn btn-sm signout" type="submit">Sign out</button>
    </form>
    {% endif %}
</header>

<div class="container mt-3">
    <div class="search-card" style="max-width: 900px; margin: 0 auto;">
        <h2 style="font-size: 28px; font-weight: 700; margin-bottom: 24px; text-align: center;">
            Search Regulatory Databases
        </h2>

        <form action="/search_page" method="get">
            <input type="hidden" name="live" value="true">
            <input type="hidden" name="page" value="1">
            <input type="hidden" name="page_size" value="50">

            <!-- Substance Input -->
            <div class="mb-4">
                <label class="form-label">🔬 Active Substance</label>
                <input
                    type="text"
                    name="substance"
                    class="form-control"
                    required
                    style="font-size: 16px; padding: 12px 16px;"
                    placeholder="e.g. metformin, atorvastatin, semaglutide">
            </div>

            <!-- Optional: narrow the search to a strength and a dosage form. -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">💊 Strength <span style="opacity: 0.6; font-weight: 400;">(optional)</span></label>
                    <input
                        type="text"
                        name="strength"
                        class="form-control"
                        style="font-size: 16px; padding: 12px 16px;"
                        placeholder="e.g. 500 mg, 10 mg, 0.5 g">
                </div>
                <div class="col-md-6">
                    <label class="form-label">🧪 Dosage form <span style="opacity: 0.6; font-weight: 400;">(optional)</span></label>
                    <input
                        type="text"
                        name="dosage_form"
                        class="form-control"
                        list="dosage-form-suggestions"
                        style="font-size: 16px; padding: 12px 16px;"
                        placeholder="e.g. tablet, capsule, injection">
                    <datalist id="dosage-form-suggestions">
                        <option value="Tablet"><option value="Film-coated tablet"><option value="Capsule">
                        <option value="Injection"><option value="Solution"><option value="Suspension">
                        <option value="Syrup"><option value="Cream"><option value="Ointment">
                        <option value="Powder"><option value="Inhaler"><option value="Eye drops">
                    </datalist>
                </div>
            </div>

            <!-- One search: every source. With no source list, the search page
                 searches every enabled source, so every country is in the results. -->
            <div style="display: flex; justify-content: center;">
                <button class="btn btn-primary" type="submit" name="search_mode" value="full" style="min-width: 240px; padding: 12px 32px; font-size: 16px; font-weight: 600;">
                    🔍 Search
                </button>
            </div>
        </form>

        <!-- Recent searches, kept in this browser only: one click runs one again. -->
        <div id="recent-searches" style="display: none; margin-top: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="form-label mb-0" style="font-size: 14px; opacity: 0.8;">🕘 Recent searches</span>
                <button type="button" id="clear-recent" class="btn btn-sm" style="background: transparent; border: none; color: rgba(255, 255, 255, 0.6); font-size: 13px;">Clear</button>
            </div>
            <div id="recent-list" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
        </div>
    </div>
</div>

<script>
(function () {
    const KEY = "pharmasearch.recentSearches";
    const MAX = 8;
    const form = document.querySelector('form[action="/search_page"]');
    const box = document.getElementById("recent-searches");
    const list = document.getElementById("recent-list");

    function load() {
        try {
            const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
            return Array.isArray(saved) ? saved : [];
        } catch (e) {
            return [];
        }
    }
    function save(items) {
        try {
            localStorage.setItem(KEY, JSON.stringify(items));
        } catch (e) {
            // Private window or storage blocked: recent searches just are not kept.
        }
    }
    function label(item) {
        return [item.substance, item.strength, item.dosage_form].filter(Boolean).join(" \u00b7 ");
    }
    function render() {
        const items = load();
        list.textContent = "";
        box.style.display = items.length ? "block" : "none";
        items.forEach(function (item) {
            const params = new URLSearchParams({
                live: "true", page: "1", page_size: "50", search_mode: "full",
                substance: item.substance,
            });
            if (item.strength) params.set("strength", item.strength);
            if (item.dosage_form) params.set("dosage_form", item.dosage_form);
            const link = document.createElement("a");
            link.href = "/search_page?" + params.toString();
            link.textContent = label(item);
            link.className = "btn btn-sm";
            link.style.cssText = "background: rgba(96, 165, 250, 0.15); border: 1px solid rgba(96, 165, 250, 0.35); color: #93c5fd;";
            list.appendChild(link);
        });
    }
    form.addEventListener("submit", function () {
        const value = function (name) {
            const field = form.querySelector('[name="' + name + '"]');
            return field ? field.value.trim() : "";
        };
        const item = { substance: value("substance"), strength: value("strength"), dosage_form: value("dosage_form") };
        if (!item.substance) return;
        const key = label(item).toLowerCase();
        const items = load().filter(function (old) { return label(old).toLowerCase() !== key; });
        items.unshift(item);
        save(items.slice(0, MAX));
    });
    document.getElementById("clear-recent").addEventListener("click", function () {
        save([]);
        render();
    });
    render();
})();
</script>


</body>
</html>
